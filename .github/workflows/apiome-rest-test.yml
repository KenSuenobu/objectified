name: Apiome REST Tests

# Runs the apiome-rest pytest suite with coverage on every push / PR that touches the service
# (RC1-3.1, #3616). This gates merges on the REST spine endpoints: a regression here goes red.
# The suite is self-contained (no external database) — the handful of live-DB integration tests skip
# themselves when DATABASE_URL is unset. Full end-to-end DB coverage is the golden-path workflow's
# job (postgres -> migrate -> seed -> rest -> mcp).

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apiome-rest/**'
      - '.github/workflows/apiome-rest-test.yml'
      # The generated supported-formats page (FMT-1.2) is drift-checked by this suite. It is
      # listed here so a hand edit of the page alone still triggers the check that rejects it.
      - 'docs/guide/supported-formats.md'
      # The import corpus this suite runs (detect/import/golden/round-trip) lives here, so a
      # fixture or manifest edit alone must trigger it — FMT-1.3 found an `asyncapi` fixture
      # that had never been validated because the parser was absent.
      - 'apiome-ui/examples/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apiome-rest/**'
      - '.github/workflows/apiome-rest-test.yml'
      - 'docs/guide/supported-formats.md'
      - 'apiome-ui/examples/**'
  workflow_dispatch:

jobs:
  test:
    name: pytest + coverage
    runs-on: self-hosted
    # Self-hosted runners may export a host DATABASE_URL (e.g. …/objectified) that is not
    # the apiome CI database. Clear it so live-DB integration tests skip as documented above.
    env:
      DATABASE_URL: ""
    defaults:
      run:
        working-directory: apiome-rest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python comes from uv, not actions/setup-python: the CPython builds setup-python
      # downloads for Ubuntu 26.04 declare `x86 ISA needed: x86-64-v3`, which the self-hosted
      # runner's vCPU does not provide, so they abort with "CPU ISA level is lower than
      # required". uv's python-build-standalone builds are baseline x86-64.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (incl. dev/test group)
        run: uv sync

      # The AsyncAPI parser is a HARD toolchain dependency (FMT-1.3, #5414): the adapter has no
      # fallback, so without it every asyncapi corpus/golden/round-trip row silently skips and a
      # regression in a shipped format never goes red here. Install the exact pin from the
      # toolchain manifest (the same one the container build uses) into apiome-rest/.tools,
      # where app.toolchain_runner resolves bundled tools without touching PATH.
      # npm is what installs the pinned parser; the runtime image uses node for the same wrapper.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the required AsyncAPI toolchain
        run: ./scripts/install_dev_toolchain.sh asyncapi-parser

      # Loud, named gate: prove the required toolchain is actually usable before spending the
      # suite on it. A failure here says "the parser did not install", not "1,000 asyncapi
      # tests skipped".
      - name: Verify the required toolchain self-check passes
        env:
          APIOME_REQUIRE_TOOLCHAIN: "1"
        run: uv run python -m app.toolchain_selfcheck

      # An explicit, readable gate for the generated docs (FMT-1.2, #5413). The pytest suite
      # below asserts the same thing, but a dedicated step names the failure and the one-line
      # fix instead of burying it among thousands of test results.
      - name: Check generated supported-formats page is current
        run: uv run python scripts/generate_supported_formats_doc.py --check

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov --cov-report=term-missing --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### apiome-rest coverage'
            echo ''
            echo '```'
            uv run coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apiome-rest-coverage
          path: |
            apiome-rest/coverage.xml
            apiome-rest/pytest-report.xml
          if-no-files-found: ignore
        continue-on-error: true
