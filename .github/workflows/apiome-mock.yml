name: Apiome Mock

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/apiome-mock.yml'
      - 'apiome-mock/**'
      - 'apiome-mcp/**'
      - 'apiome-rest/**'
      - 'mock-action/**'
      - 'docker-compose.yml'
      - 'docker-compose.env.example'
      - 'apiome-db/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/apiome-mock.yml'
      - 'apiome-mock/**'
      - 'apiome-mcp/**'
      - 'apiome-rest/**'
      - 'mock-action/**'
      - 'docker-compose.yml'
      - 'docker-compose.env.example'
      - 'apiome-db/**'
  workflow_dispatch:

jobs:
  test:
    name: Lint, type-check and test apiome-mock
    runs-on: self-hosted
    env:
      APIOME_MOCK_DATABASE_URL: postgresql://postgres:postgres@localhost:55432/apiome_ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apiome_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apiome_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose specification
        run: docker compose config

      # Python comes from uv, not actions/setup-python: the CPython builds setup-python
      # downloads for Ubuntu 26.04 declare `x86 ISA needed: x86-64-v3`, which the self-hosted
      # runner's vCPU does not provide, so they abort with "CPU ISA level is lower than
      # required". uv's python-build-standalone builds are baseline x86-64.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: apiome-mock

      - name: Ruff lint
        run: uv run ruff check .
        working-directory: apiome-mock

      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: apiome-mock

      - name: Mypy type check
        run: uv run mypy -p apiome_mock
        working-directory: apiome-mock

      - name: Run pytest
        run: uv run pytest
        working-directory: apiome-mock

  mock-action:
    name: Test the mock CI action
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check the action scripts
        run: node --check lib.js && node --check main.js && node --check post.js
        working-directory: mock-action

      - name: Run mock-action tests
        run: node --test tests/*.test.js
        working-directory: mock-action

  publish-docker-image:
    name: Build and push apiome-mock image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: self-hosted
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      IMAGE_NAME: apiome-mock

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read package version
        id: meta
        working-directory: apiome-mock
        run: |
          set -euo pipefail
          version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        run: |
          chmod +x .github/scripts/setup-buildx-self-hosted.sh
          .github/scripts/setup-buildx-self-hosted.sh

      - name: Log in to Docker registry
        run: echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apiome-mock/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push Docker image
        run: |
          chmod +x .github/scripts/docker-push-with-retry.sh
          .github/scripts/docker-push-with-retry.sh \
            "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
