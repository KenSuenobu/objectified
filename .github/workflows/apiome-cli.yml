name: apiome-cli

on:
  push:
    paths:
      - "apiome-cli/**"
      - ".github/workflows/apiome-cli.yml"
      - "yarn.lock"
      - "package.json"
  pull_request:
    paths:
      - "apiome-cli/**"
      - ".github/workflows/apiome-cli.yml"
      - "yarn.lock"
      - "package.json"

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Python comes from uv, not actions/setup-python: the CPython builds setup-python
      # downloads for Ubuntu 26.04 declare `x86 ISA needed: x86-64-v3`, which the self-hosted
      # runner's vCPU does not provide, so they abort with "CPU ISA level is lower than
      # required". uv's python-build-standalone builds are baseline x86-64.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Enable Corepack and set Yarn to 4.12.0
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Install root workspace (scaffold scripts)
        run: yarn install --immutable

      - name: Lint Apiome CLI
        run: |
          cd apiome-cli
          uv sync
          uv run ruff check src/ tests/

      - name: Run Apiome CLI tests
        run: |
          cd apiome-cli
          uv run pytest tests/ -v
          node --test test/*.test.mjs
        env:
          APIOME_LOAD_DOTENV: "0"

      - name: Build Apiome CLI
        run: |
          cd apiome-cli
          yarn build
