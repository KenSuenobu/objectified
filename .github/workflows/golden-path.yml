name: Golden Path

# End-to-end spine smoke test (RC1-0.1, #3608). Brings up the full spine via the root
# docker-compose (postgres -> migrate -> seed -> rest -> mcp) and runs the golden path:
#   import OpenAPI -> edit a class & a path -> lint -> cut a version -> publish
#                 -> enable mock -> GET /pets via mock -> view in browse -> export via CLI -> query via MCP
# Run **on demand only** — start it from the Actions tab (or `gh workflow run golden-path.yml`).
# It brings up the whole spine on a self-hosted runner, so it is deliberately not wired to
# push/pull_request. Because it no longer runs automatically it cannot serve as a required
# status check; run it before a release, or after a change to the spine, docker-compose, or
# scripts/golden_path/.

on:
  workflow_dispatch:

jobs:
  golden-path:
    name: End-to-end golden path
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose specification
        run: docker compose config

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install apiome-cli (harness + CLI deps)
        run: uv sync
        working-directory: apiome-cli

      - name: Bring up the spine
        run: docker compose up --build --wait

      - name: Load dev seed data
        run: docker compose run --rm seed

      - name: Run the golden-path smoke test
        env:
          APIOME_REST_URL: http://localhost:8000
          APIOME_MCP_URL: http://localhost:8765/mcp
          APIOME_MOCK_URL: http://localhost:8775
          APIOME_CLI_CMD: uv run --project apiome-cli apiome
        run: uv run --project apiome-cli python scripts/golden_path/smoke.py

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.logs.txt 2>&1 || true

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-stack-logs
          path: docker-compose.logs.txt
          if-no-files-found: ignore
        continue-on-error: true

      - name: Tear down
        if: always()
        run: docker compose down -v
