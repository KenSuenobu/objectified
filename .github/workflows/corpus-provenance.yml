name: Corpus Provenance

# Provenance, licensing and generated-index gate for the import example corpus (IXH-1.9, #5095).
#
# The corpus lives under apiome-ui/examples/, so a manifest-only change does not trigger the
# apiome-rest test workflow that owns the rest of the corpus contract. This workflow closes that
# gap: it is stdlib-only Python, needs no database and no package install, and fails a pull request
# that adds an example without a license, contradicts its declared origin, or commits a captured
# payload with no anonymization statement.
#
# Contributor documentation for the rules enforced here: docs/CORPUS_CONTRIBUTOR_GUIDE.md

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apiome-ui/examples/**'
      - 'scripts/check_corpus_provenance.py'
      - 'scripts/generate_examples_readme.py'
      - 'docs/CORPUS_CONTRIBUTOR_GUIDE.md'
      - '.github/workflows/corpus-provenance.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apiome-ui/examples/**'
      - 'scripts/check_corpus_provenance.py'
      - 'scripts/generate_examples_readme.py'
      - 'docs/CORPUS_CONTRIBUTOR_GUIDE.md'
      - '.github/workflows/corpus-provenance.yml'
  workflow_dispatch:

jobs:
  provenance:
    name: Corpus provenance and licensing
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python comes from uv, not actions/setup-python: the CPython builds setup-python
      # downloads for Ubuntu 26.04 declare `x86 ISA needed: x86-64-v3`, which the self-hosted
      # runner's vCPU does not provide, so they abort with "CPU ISA level is lower than
      # required". uv's python-build-standalone builds are baseline x86-64.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Check corpus provenance and licensing
        id: provenance
        run: uv run --no-project python scripts/check_corpus_provenance.py

      - name: Check the generated examples README is current
        run: uv run --no-project python scripts/generate_examples_readme.py --check

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Corpus provenance'
            echo ''
            if [ "${{ steps.provenance.outcome }}" = "success" ]; then
              echo 'Every corpus entry declares an approved license, an origin consistent with its'
              echo 'source, and — for captured payloads — how it was anonymized.'
            else
              echo 'Provenance violations were found. Run `python3 scripts/check_corpus_provenance.py`'
              echo 'locally and see [the contributor guide](docs/CORPUS_CONTRIBUTOR_GUIDE.md).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
