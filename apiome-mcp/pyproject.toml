[project]
name = "apiome-mcp"
version = "0.3.0"
description = "Model Context Protocol server for Apiome (FastMCP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apiome Team" }]
keywords = ["mcp", "fastmcp", "apiome", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0.2",
    "apiome-rest>=1.0.53",
    "bcrypt>=4.0",
    "fastmcp>=3.2.0",
    "structlog>=24.4.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.28.1",
    "pgvector>=0.4.2",
]

[project.scripts]
apiome-mcp = "apiome_mcp.cli:main"
mcp = "apiome_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiome_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = ["src", "../apiome-rest/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../apiome-rest/src"]

[tool.uv.sources]
apiome-rest = { path = "../apiome-rest", editable = true }
