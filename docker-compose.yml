# Local spine stack: Postgres 16 (persistent volume), schema migrations, dev seed, apiome-rest
# (HTTP API) and apiome-mcp (HTTP). This is the stack exercised by the end-to-end golden-path
# smoke test (scripts/golden_path/, docs/GOLDEN_PATH.md).
# From repo root:
#   docker compose up --build --wait
#
# Services:
#   postgres  Postgres 16 with a persistent volume.
#   migrate   One-shot Flyway migrations (runs to completion, then exits).
#   seed      One-shot dev seed data (sample tenant `acme-corp` + API key); runs after migrate.
#   rest      apiome-rest FastAPI service on :8000 (depends on migrate + seed).
#   mcp       apiome-mcp HTTP service on :8765 (depends on migrate + seed).
#   mock      apiome-mock HTTP service on :8775 (depends on migrate + seed).
#
# Override secrets via environment or a `.env` file (see docker-compose.env.example).

services:
  postgres:
    # pgvector/pgvector ships Postgres 16 with the `vector` extension preinstalled, which the
    # schema requires (V001 `CREATE EXTENSION vector`; embedding columns/HNSW indexes in V062/V102).
    # Plain `postgres:16-bookworm` lacks it and fails the first migration.
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
    volumes:
      - apiome_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  migrate:
    build:
      context: ./apiome-db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - apiome-mcp

  # One-shot dev seed (sample tenant `acme-corp`, sample user, dev API key). Runs after migrations
  # complete and exits. NODE_ENV is forced to development so the seed guard (which refuses to load
  # dev data under NODE_ENV=production) allows it. Seed SQL is idempotent (ON CONFLICT DO NOTHING).
  seed:
    build:
      context: ./apiome-db
      dockerfile: Dockerfile
    command: ["seed"]
    environment:
      NODE_ENV: development
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - apiome-mcp

  # apiome-rest FastAPI service. The golden-path smoke test drives import / edit / version /
  # publish / browse / export through this service (the same endpoints the UI calls).
  rest:
    build:
      # Repo root context so the Dockerfile can pull in the apiome-ui workspace (the
      # spec-import worker runs as a tsx script from apiome-ui).
      context: .
      dockerfile: apiome-rest/Dockerfile
    ports:
      - "${APIOME_REST_HTTP_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiome_local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apiome}
      APIOME_MOCK_PUBLIC_BASE_URL: ${APIOME_MOCK_PUBLIC_BASE_URL:-http://localhost:8775}
      # ── DB-over-env sign-in provider configuration (OLO-8.3/8.4/8.5) ────────────────────────
      # A compose service only receives the variables listed here, and there is no `env_file`,
      # so anything absent from this block is simply not in the container no matter what the
      # operator's .env says. All five are optional pass-throughs (empty ⇒ unset), but each
      # missing one silently disables a step of the admin-configured provider path, and every
      # failure in that path degrades to env-configured providers rather than erroring:
      #
      #   ADMIN_SESSION_SECRET / ADMIN_PASSWORD  verify the /admin portal's signed session, so
      #       GET/PUT /v1/admin/auth-providers can be served at all. With neither set that
      #       surface fails closed and every save is rejected. Must match apiome-ui's values.
      #   AUTH_CONFIG_ENC_KEY                    seals the client secret before it is stored.
      #       Without it, saving a secret is a 503 ("secret encryption is not configured").
      #   INTERNAL_SERVICE_TOKEN                 gates GET /v1/internal/auth-providers/resolved,
      #       the login-time read apiome-ui merges over env. Unset ⇒ 503 ⇒ sign-in keeps using
      #       GITHUB_ID/GITHUB_SECRET and the admin screen appears to do nothing. Must match
      #       apiome-ui's INTERNAL_SERVICE_TOKEN byte for byte.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_CONFIG_ENC_KEY: ${AUTH_CONFIG_ENC_KEY:-}
      AUTH_CONFIG_ENC_ACTIVE_KEY_ID: ${AUTH_CONFIG_ENC_ACTIVE_KEY_ID:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    # Readiness probe (#3617): /readyz verifies the database is reachable (503 otherwise), so
    # orchestration only marks `rest` healthy once it can actually serve traffic. /livez exists for
    # a process-only liveness check that ignores the database.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  mcp:
    build:
      context: .
      dockerfile: apiome-mcp/Dockerfile
    ports:
      - "${APIOME_MCP_HTTP_PORT:-8765}:${APIOME_MCP_HTTP_PORT:-8765}"
    environment:
      APIOME_MCP_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-apiome_local_dev}@postgres:5432/${POSTGRES_DB:-apiome}
      APIOME_MCP_INTERNAL_SECRET: ${APIOME_MCP_INTERNAL_SECRET:-apiome-local-dev-secret-min-16}
      APIOME_MCP_HTTP_HOST: 0.0.0.0
      APIOME_MCP_HTTP_PORT: ${APIOME_MCP_HTTP_PORT:-8765}
      # AGX-2.4: toolsets with target=mock route tools/call to the mock service below.
      APIOME_MCP_MOCK_PUBLIC_BASE_URL: ${APIOME_MOCK_PUBLIC_BASE_URL:-http://localhost:8775}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    # Health probe (#3617): the MCP HTTP server exposes GET /health; wiring it into compose makes a
    # crashed/unready MCP visible to `docker compose ps` / `--wait` instead of silently "up".
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APIOME_MCP_HTTP_PORT:-8765}/health', timeout=4)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

  # apiome-mock hosted mock runtime. Serves published, mock-enabled versions at
  # /{tenant}/{project}/{version}/{path}. Exercised by the golden-path smoke test (#4421).
  mock:
    build:
      context: .
      dockerfile: apiome-mock/Dockerfile
    ports:
      - "${APIOME_MOCK_HTTP_PORT:-8775}:8775"
    environment:
      APIOME_MOCK_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-apiome_local_dev}@postgres:5432/${POSTGRES_DB:-apiome}
      APIOME_MOCK_HTTP_HOST: 0.0.0.0
      APIOME_MOCK_HTTP_PORT: 8775
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8775/health', timeout=4)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - apiome-mcp

volumes:
  apiome_postgres_data:

networks:
  apiome-mcp:
    driver: bridge
