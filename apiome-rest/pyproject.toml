[project]
name = "apiome-rest"
version = "1.175.0"
description = "REST API for serving OpenAPI specifications from the Apiome database"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Apiome Team"}
]
keywords = ["fastapi", "openapi", "rest-api", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "python-multipart>=0.0.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "bcrypt==4.2.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "email-validator==2.2.0",
    "pyjwt>=2.8.0",
    "numpy>=2.4.2",
    "pgvector>=0.4.2",
    "chevron>=0.14.0",
    "jsonschema>=4.21.0",
    "structlog>=24.4.0",
    "graphql-core>=3.2.3",
    "fastavro>=1.9.0",
    "protobuf>=5.28.0",
    "grpcio>=1.66.0",
    "grpcio-reflection>=1.66.0",
    "jsonpath-ng>=1.6.1",
    "regex>=2024.4.16",
    "asn1tools>=0.167.0",
    "pyx12>=4.0.0",
    # Hardened XML parsing for import intake (IXH-1.4): declared explicitly rather
    # than relied on as a pyx12 transitive dependency.
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "requires_db: integration test that needs a live Postgres (set DATABASE_URL). Skipped otherwise.",
]

[tool.coverage.run]
branch = true
source = ["src/app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

