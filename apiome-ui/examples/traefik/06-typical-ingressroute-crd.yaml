apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orders
  namespace: storefront
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.example.com`) && PathPrefix(`/v2/orders`)
      kind: Rule
      priority: 100
      services:
        - name: orders
          port: 8080
          strategy: RoundRobin
      middlewares:
        - name: rate-limit
    - match: Host(`api.example.com`) && Path(`/healthz`)
      kind: Rule
      services:
        - name: orders
          port: 8080
  tls:
    secretName: api-example-com-cert
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: storefront
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1m
