http:
  routers:
    orders:
      rule: Host(`api.example.com`) && PathPrefix(`/v2/orders`)
      entryPoints:
        - websecure
      service: orders-service
      middlewares:
        - rate-limit
        - strip-v2
      tls:
        certResolver: letsencrypt
      priority: 100

    catalogue:
      rule: Host(`api.example.com`) && PathPrefix(`/v2/products`)
      entryPoints:
        - websecure
      service: catalogue-service
      tls: {}

    redirect-to-https:
      rule: HostRegexp(`^.+\.example\.com$`)
      entryPoints:
        - web
      service: noop@internal
      middlewares:
        - https-redirect

  services:
    orders-service:
      loadBalancer:
        servers:
          - url: http://orders-1.internal.example.com:8080
          - url: http://orders-2.internal.example.com:8080
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        passHostHeader: true

    catalogue-service:
      loadBalancer:
        servers:
          - url: http://catalogue.internal.example.com:8080
        sticky:
          cookie:
            name: catalogue-affinity
            secure: true
            httpOnly: true

  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    strip-v2:
      stripPrefix:
        prefixes:
          - /v2
        forceSlash: false

    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
