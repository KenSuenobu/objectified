# AsyncAPI 2.6 minimal example — the smallest canonical document.
#
# Just the three required root sections (`asyncapi`, `info`, `channels`) with a
# single channel publishing an inline string payload. This is the hello-world of
# the format: no components, no servers, no refs — the floor a valid AsyncAPI 2.x
# document can stand on.
asyncapi: 2.6.0
info:
  title: Heartbeat Service
  version: 1.0.0
channels:
  heartbeat:
    publish:
      operationId: publishHeartbeat
      summary: Emit a liveness heartbeat.
      message:
        name: heartbeat
        payload:
          type: string
          description: ISO 8601 timestamp of the heartbeat.
