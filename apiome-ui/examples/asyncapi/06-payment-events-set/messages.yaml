# AsyncAPI 3.0 multi-file example — messages member.
#
# Message definitions referenced from asyncapi.yaml (the set root) via
# `./messages.yaml#/<Name>` cross-file $refs. Each payload is itself a
# cross-file $ref into ./schemas.yaml, so bundling has to chase refs
# member-to-member, not just root-to-member.
PaymentAuthorized:
  name: paymentAuthorized
  title: Payment authorized
  contentType: application/json
  payload:
    $ref: './schemas.yaml#/PaymentAuthorizedPayload'
PaymentCaptured:
  name: paymentCaptured
  title: Payment captured
  contentType: application/json
  payload:
    $ref: './schemas.yaml#/PaymentCapturedPayload'
