# AsyncAPI 3.0 multi-file example — set root.
#
# The entry point of a three-file set: channels here reference message
# definitions in ./messages.yaml via cross-file $refs, and those messages in
# turn reference payload schemas in ./schemas.yaml. The importer bundles the
# members into one document before parsing (fileset import, MFI-29.2).
asyncapi: 3.0.0
info:
  title: Payment Events
  version: 1.0.0
  description: Streams payment lifecycle events split across reusable files.
servers:
  production:
    host: broker.example.com:9092
    protocol: kafka
    description: Production Kafka cluster.
channels:
  paymentAuthorized:
    address: payment/authorized
    description: A payment was authorized by the processor.
    messages:
      PaymentAuthorized:
        $ref: './messages.yaml#/PaymentAuthorized'
  paymentCaptured:
    address: payment/captured
    description: An authorized payment was captured.
    messages:
      PaymentCaptured:
        $ref: './messages.yaml#/PaymentCaptured'
operations:
  receivePaymentAuthorized:
    action: receive
    channel:
      $ref: '#/channels/paymentAuthorized'
    summary: Handle a newly authorized payment.
  receivePaymentCaptured:
    action: receive
    channel:
      $ref: '#/channels/paymentCaptured'
    summary: Handle a captured payment.
