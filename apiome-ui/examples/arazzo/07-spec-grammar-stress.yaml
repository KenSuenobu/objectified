# Stress example exercising the less common corners of the Arazzo 1.0 grammar in one
# document: multiple workflows with workflow-level dependsOn and outputs, operationRef
# sourceDescriptions pointers alongside operationId, typed successCriteria (jsonpath
# and regex), reusable components.parameters referenced from steps, onSuccess/onFailure
# actions, and x- vendor extensions.
arazzo: 1.0.1
info:
  title: Inventory Sync and Audit Grammar Stress
  version: 2.1.0
  description: >
    Two dependent workflows that together exercise operationRef pointers, typed
    success criteria, reusable components, flow actions, and vendor extensions.
x-owner: platform-team

sourceDescriptions:
  - name: inventoryApi
    type: openapi
    url: https://example.com/openapi/inventory.json
  - name: reportingApi
    type: openapi
    url: https://example.com/openapi/reporting.json

workflows:
  - workflowId: sync-inventory
    summary: Pull inventory items and push a stock snapshot
    inputs:
      type: object
      properties:
        warehouseId:
          type: string
          description: Warehouse whose stock should be synchronized
    steps:
      - stepId: fetch-items
        description: Fetch current items via an operationRef pointer
        operationRef: "#/sourceDescriptions/inventoryApi/paths/~1items/get"
        parameters:
          - name: warehouse
            in: query
            value: $inputs.warehouseId
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            condition: $.items[0].sku
            type: jsonpath
        onFailure:
          - name: retryFetch
            type: retry
            retryAfter: 2
            retryLimit: 3
        outputs:
          firstSku: $response.body#/items/0/sku

      - stepId: push-snapshot
        description: Push a stock snapshot for the fetched items
        operationId: createSnapshot
        requestBody:
          contentType: application/json
          payload:
            warehouse: $inputs.warehouseId
            firstSku: $steps.fetch-items.outputs.firstSku
        successCriteria:
          - condition: $statusCode == 201
          - context: $response.header.Location
            condition: ^/snapshots/[0-9]+$
            type: regex
        onSuccess:
          - name: recordAndFinish
            type: end
        outputs:
          snapshotId: $response.body#/id
    outputs:
      snapshotId: $steps.push-snapshot.outputs.snapshotId

  - workflowId: audit-report
    summary: Build an audit report from the latest snapshot
    dependsOn:
      - sync-inventory
    steps:
      - stepId: build-report
        description: Build the audit report using a reusable page-size parameter
        operationId: buildAuditReport
        parameters:
          - reference: $components.parameters.pageSize
          - name: snapshot
            in: query
            value: $workflows.sync-inventory.outputs.snapshotId
        successCriteria:
          - condition: $statusCode == 202
        outputs:
          reportId: $response.body#/reportId
    outputs:
      reportId: $steps.build-report.outputs.reportId

components:
  parameters:
    pageSize:
      name: pageSize
      in: query
      value: 100
