apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infrastructure-only
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: tcp-passthrough
spec:
  rules:
    - backendRefs:
        - name: tcp-svc
          port: 5432
