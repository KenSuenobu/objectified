apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing
  namespace: finance
spec:
  parentRefs:
    - name: team-gateway
      namespace: gateway-system
  hostnames: [billing.example.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /invoices
          method: GET
      backendRefs:
        - name: billing-svc
          port: 8080
