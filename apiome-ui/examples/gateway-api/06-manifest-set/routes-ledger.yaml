apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ledger
  namespace: finance
spec:
  parentRefs:
    - name: team-gateway
      namespace: gateway-system
  hostnames: [billing.example.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ledger
          method: GET
        - path:
            type: PathPrefix
            value: /ledger
          method: POST
      backendRefs:
        - name: ledger-svc
          port: 8081
