# The route names cluster `orders_service`, and no cluster with that name is defined in
# this document or supplied alongside it, so the backend cannot be resolved.
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: dangling_route
                  virtual_hosts:
                    - name: dangling
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /v2/orders
                          route:
                            cluster: orders_service
                http_filters:
                  - name: envoy.filters.http.router
  clusters:
    - name: catalogue_service
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: catalogue_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: catalogue.internal.example.com
                      port_value: 8080
