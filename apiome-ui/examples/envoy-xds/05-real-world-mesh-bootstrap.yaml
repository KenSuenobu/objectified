# Sidecar bootstrap as a mesh control plane renders it: node metadata, dynamic xDS from
# the control plane, plus the static listener and cluster the sidecar always needs.
node:
  id: sidecar~10.244.1.17~orders-7d9f8c6b5-2xk4l.storefront~storefront.svc.cluster.local
  cluster: orders.storefront
  metadata:
    APP_CONTAINERS: orders
    CLUSTER_ID: production
    ISTIO_VERSION: 1.24.2
    MESH_ID: mesh-example
    NAMESPACE: storefront
    SERVICE_ACCOUNT: orders
    WORKLOAD_NAME: orders

admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 15000

dynamic_resources:
  lds_config:
    ads: {}
    initial_fetch_timeout: 0s
    resource_api_version: V3
  cds_config:
    ads: {}
    initial_fetch_timeout: 0s
    resource_api_version: V3
  ads_config:
    api_type: GRPC
    set_node_on_first_message_only: true
    transport_api_version: V3
    grpc_services:
      - envoy_grpc:
          cluster_name: xds-grpc

static_resources:
  listeners:
    - name: virtualInbound
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15006
      traffic_direction: INBOUND
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inbound_8080
                use_remote_address: false
                route_config:
                  name: inbound|8080||
                  virtual_hosts:
                    - name: inbound|http|8080
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /v2/orders
                          route:
                            cluster: inbound|8080||
                            timeout: 0s
                            max_stream_duration:
                              max_stream_duration: 0s
                        - match:
                            prefix: /healthz/ready
                          direct_response:
                            status: 200
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        example-issuer:
                          issuer: https://login.example.com/
                          audiences:
                            - orders-api
                          remote_jwks:
                            http_uri:
                              uri: https://login.example.com/.well-known/jwks.json
                              cluster: outbound|443||login.example.com
                              timeout: 5s
                      rules:
                        - match:
                            prefix: /v2/orders
                          requires:
                            provider_name: example-issuer
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: xds-grpc
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xds-grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: istiod.istio-system.svc
                      port_value: 15012
    - name: inbound|8080||
      type: STATIC
      connect_timeout: 10s
      load_assignment:
        cluster_name: inbound|8080||
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.6
                      port_value: 8080
    - name: prometheus_stats
      type: STATIC
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: prometheus_stats
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 15000
