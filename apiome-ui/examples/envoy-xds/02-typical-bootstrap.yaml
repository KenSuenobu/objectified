admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: storefront_route
                  virtual_hosts:
                    - name: storefront
                      domains:
                        - api.example.com
                        - api.example.com:8080
                      routes:
                        - match:
                            path: /health
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok"}'
                        - match:
                            prefix: /v2/orders
                          route:
                            cluster: orders_service
                            timeout: 15s
                        - match:
                            prefix: /v2/products
                          route:
                            cluster: catalogue_service
                            prefix_rewrite: /products
                        - match:
                            prefix: /
                          route:
                            cluster: legacy_service
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: orders_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: orders_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: orders.internal.example.com
                      port_value: 8080
    - name: catalogue_service
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: catalogue_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: catalogue.internal.example.com
                      port_value: 8080
    - name: legacy_service
      type: STATIC
      connect_timeout: 10s
      load_assignment:
        cluster_name: legacy_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 10.20.30.40
                      port_value: 80
