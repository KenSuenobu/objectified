# Fileset member: the route configuration the bootstrap's `rds` block names. Without the
# bootstrap there is no listener; without this file the listener has no routes.
resources:
  - "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: edge_route
    virtual_hosts:
      - name: edge
        domains:
          - api.example.com
        routes:
          - match:
              path: /healthz
            direct_response:
              status: 200
              body:
                inline_string: '{"status":"ok"}'
          - match:
              prefix: /v2/shipments
            route:
              cluster: shipments_service
              timeout: 20s
          - match:
              safe_regex:
                google_re2: {}
                regex: "^/v2/parcels/[A-Z0-9-]+$"
            route:
              cluster: parcels_service
          - match:
              prefix: /
            route:
              cluster: legacy_service
