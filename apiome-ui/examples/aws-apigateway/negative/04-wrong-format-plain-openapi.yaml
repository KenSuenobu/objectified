openapi: 3.1.0
info:
  title: Orders API
  version: 2.3.0
servers:
  - url: https://api.example.com/v2
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Matching orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One order
components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
