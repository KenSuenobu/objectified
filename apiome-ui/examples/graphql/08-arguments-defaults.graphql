# Schema demonstrating arguments and default values

"""
Pagination connection pattern (Relay-style)
"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalCount: Int!
}

type UserEdge {
  node: User!
  cursor: String!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type User {
  id: ID!
  name: String!
  email: String!
  posts(
    "Number of items to return"
    first: Int = 10
    "Return items after this cursor"
    after: String
    "Filter by published status"
    published: Boolean
    "Sort order"
    orderBy: PostOrderBy = CREATED_AT_DESC
  ): PostConnection!

  followers(first: Int = 20, after: String): UserConnection!
  following(first: Int = 20, after: String): UserConnection!
}

type PostEdge {
  node: Post!
  cursor: String!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

enum PostOrderBy {
  CREATED_AT_ASC
  CREATED_AT_DESC
  TITLE_ASC
  TITLE_DESC
  LIKES_DESC
}

type Post {
  id: ID!
  title: String!
  content: String!
  author: User!

  comments(
    first: Int = 20
    after: String
    orderBy: CommentOrderBy = CREATED_AT_DESC
  ): CommentConnection!
}

type CommentEdge {
  node: Comment!
  cursor: String!
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
}

enum CommentOrderBy {
  CREATED_AT_ASC
  CREATED_AT_DESC
  LIKES_DESC
}

type Comment {
  id: ID!
  content: String!
  author: User!
  post: Post!
  likes: Int!
}

type Query {
  """
  Get a single user by ID
  """
  user(
    "The unique ID of the user"
    id: ID!
  ): User

  """
  List users with pagination
  """
  users(
    "Number of users to return (max 100)"
    first: Int = 20
    "Cursor for pagination"
    after: String
    "Filter by name"
    nameContains: String
    "Filter by active status"
    isActive: Boolean = true
  ): UserConnection!

  """
  Search for posts
  """
  searchPosts(
    query: String!
    first: Int = 10
    after: String
    authorId: ID
    tags: [String!]
    publishedAfter: String
    publishedBefore: String
  ): PostConnection!
}
