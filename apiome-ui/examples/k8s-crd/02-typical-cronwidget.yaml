# Typical CRD — spec/status, required fields, descriptions.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronwidgets.apps.example.io
spec:
  group: apps.example.io
  scope: Namespaced
  names:
    plural: cronwidgets
    singular: cronwidget
    kind: CronWidget
    shortNames:
      - cw
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: CronWidget resource.
          properties:
            spec:
              type: object
              required:
                - schedule
                - image
              properties:
                schedule:
                  type: string
                  description: Cron schedule expression.
                image:
                  type: string
                  description: Container image to run.
                replicas:
                  type: integer
                  minimum: 0
            status:
              type: object
              properties:
                lastRun:
                  type: string
                  format: date-time
                ready:
                  type: boolean
