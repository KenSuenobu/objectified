# Location modifiers, rewrite rules, maps and variables — the directives that make a
# complete nginx parser impossible and a *bounded subset* the only honest promise.

map $http_x_tenant $tenant_backend {
    default        "shared_backend";
    "~^acme-"      "acme_backend";
    "globex"       "globex_backend";
}

geo $internal_client {
    default        0;
    10.0.0.0/8     1;
    203.0.113.0/24 1;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream shared_backend  { server shared.internal.example.com:8080; }
upstream acme_backend    { server acme.internal.example.com:8080; }
upstream globex_backend  { server globex.internal.example.com:8080; }
upstream websocket_backend { server ws.internal.example.com:8080; }

server {
    listen 443 ssl;
    server_name lab.example.com;

    # Exact match: wins over every prefix.
    location = /exact {
        proxy_pass http://shared_backend;
    }

    # Preferential prefix: stops regex evaluation.
    location ^~ /static/ {
        root /var/www;
    }

    # Case-sensitive regex.
    location ~ ^/orders/[0-9]{6}$ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn api_conn 20;
        proxy_pass http://$tenant_backend;
    }

    # Case-insensitive regex with a capture used in proxy_pass.
    location ~* ^/assays/(?<assay_id>[a-f0-9]{8})/results$ {
        proxy_pass http://shared_backend/internal/assays/$assay_id/results;
    }

    # Plain prefix with an internal rewrite.
    location /legacy/ {
        rewrite ^/legacy/(.*)$ /v3/$1 break;
        proxy_pass http://shared_backend;
    }

    # Websocket upgrade.
    location /ws {
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Conditional logic: `if` inside location is the construct a subset parser must
    # declare it does not model, rather than guessing.
    location /experiment {
        if ($internal_client = 0) {
            return 403;
        }
        if ($request_method = POST) {
            proxy_pass http://acme_backend;
        }
        proxy_pass http://shared_backend;
    }

    # Internal-only location, unreachable from outside.
    location /internal-only {
        internal;
        proxy_pass http://shared_backend;
    }

    # Named location, reached only by try_files / error_page.
    location @fallback {
        proxy_pass http://shared_backend;
    }

    location /files/ {
        try_files $uri $uri/ @fallback;
    }

    error_page 502 503 504 = @fallback;

    # Nested location: a valid nginx construct a naive parser flattens.
    location /nested/ {
        proxy_set_header X-Nested outer;

        location /nested/inner {
            proxy_pass http://globex_backend;
        }
    }
}
