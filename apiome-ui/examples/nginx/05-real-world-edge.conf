# Production edge as an operations team writes it: a storefront, an API, a metrics
# endpoint restricted by source, HTTP→HTTPS canonicalisation, and gzip/caching policy.

proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:100m max_size=5g
                 inactive=60m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=public:20m rate=50r/s;

upstream storefront {
    least_conn;
    server storefront-1.internal.example.com:3000 weight=2;
    server storefront-2.internal.example.com:3000;
    server storefront-3.internal.example.com:3000 backup;
    keepalive 64;
}

upstream api_v3 {
    server api-1.internal.example.com:8080;
    server api-2.internal.example.com:8080;
    keepalive 128;
}

upstream prometheus {
    server prometheus.internal.example.com:9090;
}

server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://storefront;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(css|js|png|jpg|svg|woff2)$ {
        proxy_pass http://storefront;
        proxy_cache api_cache;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/api.example.com.pem;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;

    client_max_body_size 25m;
    client_body_timeout 20s;

    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    location = /metrics {
        allow 10.0.0.0/8;
        allow 203.0.113.0/24;
        deny all;
        proxy_pass http://prometheus/metrics;
    }

    location /v3/ {
        limit_req zone=public burst=100 nodelay;
        proxy_pass http://api_v3/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 45s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /v2/ {
        return 410 '{"message":"v2 was withdrawn on 2026-06-30; use /v3"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404;
    }
}
