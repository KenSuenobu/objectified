upstream orders_backend {
    server orders-1.internal.example.com:8080 max_fails=3 fail_timeout=30s;
    server orders-2.internal.example.com:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream catalogue_backend {
    server catalogue.internal.example.com:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/api.example.com.pem;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    location /v2/orders {
        proxy_pass http://orders_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /v2/products {
        proxy_pass http://catalogue_backend/products;
        proxy_set_header Host $host;
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
