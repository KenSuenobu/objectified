global
    log stdout format raw local0
    maxconn 4000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend public
    bind :443 ssl crt /etc/ssl/private/api.pem
    acl is_orders path_beg /v2/orders
    use_backend orders_backend if is_orders
    default_backend legacy_backend

backend orders_backend
    server orders1 orders.internal.example.com:8080 check
