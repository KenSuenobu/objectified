# Within-document composition: a variable map and two upstreams shared by three server
# blocks, and a set of directives inherited from http down to server down to location.
# The inheritance chain is the composition an importer must resolve: a location's
# effective configuration is the merge of all three levels.

map $http_x_tenant $tenant_upstream {
    default   "shared_backend";
    "~^acme-" "acme_backend";
}

upstream shared_backend {
    server shared-1.internal.example.com:8080;
    server shared-2.internal.example.com:8080;
    keepalive 32;
}

upstream acme_backend {
    server acme.internal.example.com:8080;
    keepalive 16;
}

# http-level defaults, inherited by every server and location below.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_read_timeout 30s;
client_max_body_size 10m;

server {
    listen 443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/api.example.com.pem;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;

    # server-level override of an http-level directive.
    proxy_read_timeout 60s;
    add_header X-Served-By api always;

    location /v2/orders {
        proxy_pass http://$tenant_upstream;
    }

    location /v2/products {
        # location-level override of the server-level override.
        proxy_read_timeout 5s;
        proxy_pass http://shared_backend;
    }
}

server {
    listen 443 ssl;
    server_name partner.example.com;

    ssl_certificate     /etc/ssl/certs/partner.example.com.pem;
    ssl_certificate_key /etc/ssl/private/partner.example.com.key;

    client_max_body_size 50m;

    location /partner/v1 {
        proxy_pass http://shared_backend;
        proxy_set_header X-Partner $http_x_partner_id;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}
