# gRPC proxying and a stream (TCP) server: the second is outside the HTTP model entirely.
upstream grpc_orders {
    server orders-grpc.internal.example.com:9090;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name grpc.example.com;

    ssl_certificate     /etc/ssl/certs/grpc.example.com.pem;
    ssl_certificate_key /etc/ssl/private/grpc.example.com.key;

    location /example.orders.v1.OrderService/ {
        grpc_pass grpc://grpc_orders;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 60s;
    }

    location / {
        grpc_pass grpc://grpc_orders;
        error_page 502 = /error502grpc;
    }

    location = /error502grpc {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;
        add_header grpc-message "unavailable";
        return 204;
    }
}

stream {
    upstream postgres_backend {
        server postgres.internal.example.com:5432;
    }

    server {
        listen 5432;
        proxy_pass postgres_backend;
        proxy_timeout 1h;
    }
}
