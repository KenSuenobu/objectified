# Backends only: nothing binds a listener, so no traffic enters and no route exists.
global
    maxconn 4000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

backend orders_backend
    server orders1 orders.internal.example.com:8080 check

backend catalogue_backend
    server catalogue1 catalogue.internal.example.com:8080 check
