# use_backend names orders_backend and default_backend names legacy_backend; neither
# section exists in this configuration.
defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend public
    bind :443 ssl crt /etc/haproxy/certs/api.example.com.pem
    acl is_orders path_beg /v2/orders
    use_backend orders_backend if is_orders
    default_backend legacy_backend

backend catalogue_backend
    server catalogue1 catalogue.internal.example.com:8080 check
