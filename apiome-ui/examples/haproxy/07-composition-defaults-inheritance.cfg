# Within-document composition: two `defaults` sections, each inherited by the sections
# that follow it, plus a shared backend referenced from three frontends. A section's
# effective configuration is the merge of the nearest preceding defaults and its own
# directives — that inheritance is what an importer must resolve.

global
    log stdout format raw local0
    maxconn 30000

#---------------------------------------------------------------- HTTP defaults
defaults http-defaults
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2

frontend public_api
    bind :443 ssl crt /etc/haproxy/certs/api.example.com.pem
    acl is_orders   path_beg /v2/orders
    acl is_products path_beg /v2/products
    use_backend orders_backend   if is_orders
    use_backend shared_backend   if is_products
    default_backend shared_backend

frontend partner_api
    bind :9443 ssl crt /etc/haproxy/certs/partner.example.com.pem
    # Inherits mode, timeouts and options from http-defaults above.
    timeout server 120s
    acl is_partner path_beg /partner
    use_backend shared_backend if is_partner
    default_backend shared_backend

backend orders_backend
    balance roundrobin
    option httpchk GET /healthz
    server ord1 orders-1.internal.example.com:8080 check
    server ord2 orders-2.internal.example.com:8080 check

backend shared_backend
    balance leastconn
    server shr1 shared-1.internal.example.com:8080 check
    server shr2 shared-2.internal.example.com:8080 check

#---------------------------------------------------------------- TCP defaults
defaults tcp-defaults
    mode tcp
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend db_passthrough
    bind :5432
    # Inherits mode tcp and the long timeouts from tcp-defaults.
    default_backend postgres_backend

backend postgres_backend
    option pgsql-check user haproxy_check
    server pg1 postgres-1.internal.example.com:5432 check
    server pg2 postgres-2.internal.example.com:5432 check backup
