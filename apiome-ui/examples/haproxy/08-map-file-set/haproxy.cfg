# Root of the set: the frontend chooses its backend by looking the tenant header up in
# a map file, and rejects hosts that are not in an allowlist map. Neither decision can
# be resolved without the sibling .map files.
global
    log stdout format raw local0
    maxconn 20000

defaults
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend public
    bind :443 ssl crt /etc/haproxy/certs/api.example.com.pem

    # Host allowlist, keyed by the Host header.
    acl known_host hdr(host),lower -f /etc/haproxy/maps/hosts.map
    http-request deny deny_status 403 unless known_host

    # Backend chosen at runtime from the tenant map, with a default.
    use_backend %[req.hdr(x-tenant),lower,map_str(/etc/haproxy/maps/tenants.map,shared_backend)]
    default_backend shared_backend

backend shared_backend
    balance roundrobin
    server shr1 shared-1.internal.example.com:8080 check
    server shr2 shared-2.internal.example.com:8080 check

backend acme_backend
    server acme1 acme.internal.example.com:8080 check

backend globex_backend
    server glx1 globex.internal.example.com:8080 check
