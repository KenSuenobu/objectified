# ACL fetch/match vocabulary. Path-shaped ACLs reduce to canonical operations; the rest
# (source IP, SSL properties, rate counters, arbitrary Lua) are declared conditions.

global
    lua-load /etc/haproxy/lua/enrich.lua
    maxconn 60000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend everything
    bind :443 ssl crt /etc/haproxy/certs/lab.example.com.pem

    # Path matches, exact through regex.
    acl p_exact     path        /exact/resource
    acl p_prefix    path_beg    /prefix/
    acl p_suffix    path_end    .json
    acl p_sub       path_sub    /internal/
    acl p_dir       path_dir    /files
    acl p_regex     path_reg    ^/orders/[0-9]{6}$
    acl p_ci_regex  path_reg    -i ^/ASSAYS/[A-F0-9]{8}$

    # Method and version.
    acl m_get       method      GET HEAD
    acl m_write     method      POST PUT PATCH DELETE
    acl http2       req.ver     2.0

    # Header, query and body fetches.
    acl h_tenant    req.hdr(x-tenant)     -m beg acme-
    acl h_json      req.hdr(accept)       -m sub application/json
    acl q_full      urlp(mode)            full
    acl body_big    req.body_size         gt 1048576

    # Connection and TLS properties: no HTTP-operation analogue.
    acl from_office src                   203.0.113.0/24
    acl mutual_tls  ssl_c_used
    acl sni_secure  req.ssl_sni -i        secure.lab.example.com
    acl abusive     sc_http_req_rate(0)   gt 100

    # Lua-backed ACL: the construct a bounded parser must decline to interpret.
    acl enriched    lua.is_enriched

    http-request track-sc0 src table shared_backend
    http-request deny deny_status 429 if abusive
    http-request deny deny_status 403 if !from_office p_sub
    http-request set-var(txn.tenant) req.hdr(x-tenant)
    http-request set-header X-Request-Id %[uuid()]
    http-request capture req.hdr(user-agent) len 64

    use_backend exact_backend     if p_exact
    use_backend prefix_backend    if p_prefix m_get
    use_backend write_backend     if p_prefix m_write
    use_backend json_backend      if p_suffix h_json
    use_backend orders_backend    if p_regex
    use_backend assays_backend    if p_ci_regex
    use_backend files_backend     if p_dir
    use_backend enriched_backend  if enriched mutual_tls
    use_backend big_backend       if body_big
    default_backend shared_backend

backend exact_backend
    server s1 exact.internal.example.com:8080 check

backend prefix_backend
    server s1 prefix.internal.example.com:8080 check

backend write_backend
    server s1 write.internal.example.com:8080 check

backend json_backend
    server s1 json.internal.example.com:8080 check

backend orders_backend
    balance uri
    hash-type consistent
    server s1 orders-1.internal.example.com:8080 check weight 60
    server s2 orders-2.internal.example.com:8080 check weight 40

backend assays_backend
    server s1 assays.internal.example.com:8080 check

backend files_backend
    server s1 files.internal.example.com:8080 check

backend enriched_backend
    server s1 enriched.internal.example.com:8080 check

backend big_backend
    server s1 big.internal.example.com:8080 check

backend shared_backend
    stick-table type ip size 200k expire 5m store http_req_rate(10s)
    server s1 shared.internal.example.com:8080 check
