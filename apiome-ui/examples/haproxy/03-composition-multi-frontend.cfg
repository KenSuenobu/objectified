# Three frontends sharing backends, plus a listen section (frontend and backend in one),
# a backend switching rule with a map file, and a default TCP frontend.

global
    log stdout format raw local0
    maxconn 40000
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend www_public
    bind :443 ssl crt /etc/haproxy/certs/www.example.com.pem
    acl is_static path_end .css .js .png .svg .woff2
    use_backend static_backend if is_static
    default_backend storefront_backend

frontend api_public
    bind :8443 ssl crt /etc/haproxy/certs/api.example.com.pem
    acl host_api  hdr(host) -i api.example.com
    acl is_v3     path_beg /v3
    acl is_v2     path_beg /v2
    acl has_key   req.hdr(x-api-key) -m found

    http-request deny deny_status 401 if host_api is_v3 !has_key
    http-request return status 410 content-type application/json \
        string '{"message":"v2 was withdrawn"}' if is_v2

    # Backend chosen from a map file keyed by the tenant header.
    use_backend %[req.hdr(x-tenant),lower,map_str(/etc/haproxy/maps/tenants.map,shared_backend)]
    default_backend shared_backend

frontend partner_public
    bind :9443 ssl crt /etc/haproxy/certs/partner.example.com.pem verify required \
        ca-file /etc/haproxy/certs/partner-ca.pem
    acl is_partner_api path_beg /partner/v1
    use_backend partner_backend if is_partner_api
    default_backend legacy_backend

listen admin_stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s

backend storefront_backend
    balance roundrobin
    cookie SRV insert indirect nocache
    server web1 storefront-1.internal.example.com:3000 check cookie web1
    server web2 storefront-2.internal.example.com:3000 check cookie web2

backend static_backend
    server cdn1 cdn.internal.example.com:8080 check

backend shared_backend
    server shared1 shared.internal.example.com:8080 check

backend partner_backend
    http-request set-header X-Partner %[ssl_c_s_dn(CN)]
    server partner1 partner.internal.example.com:8080 check ssl verify none

backend legacy_backend
    server legacy1 legacy.internal.example.com:80 check backup
