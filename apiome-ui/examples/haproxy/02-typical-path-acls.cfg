global
    log stdout format raw local0 info
    maxconn 20000
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    retries 3

frontend api_public
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/api.example.com.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }

    # Path ACLs are what a route importer reads.
    acl is_health    path       /healthz
    acl is_orders    path_beg   /v2/orders
    acl is_products  path_beg   /v2/products
    acl is_metrics   path       /metrics
    acl internal_net src        10.0.0.0/8 203.0.113.0/24

    http-request return status 200 content-type application/json string '{"status":"ok"}' if is_health
    http-request deny deny_status 403 if is_metrics !internal_net

    use_backend orders_backend     if is_orders
    use_backend catalogue_backend  if is_products
    use_backend metrics_backend    if is_metrics internal_net
    default_backend legacy_backend

backend orders_backend
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    http-request set-header X-Forwarded-Proto https
    server orders1 orders-1.internal.example.com:8080 check inter 5s fall 3 rise 2
    server orders2 orders-2.internal.example.com:8080 check inter 5s fall 3 rise 2

backend catalogue_backend
    balance leastconn
    http-request replace-path ^/v2/products(.*) /products\1
    server catalogue1 catalogue.internal.example.com:8080 check

backend metrics_backend
    server prom1 prometheus.internal.example.com:9090 check

backend legacy_backend
    server legacy1 legacy.internal.example.com:80 check
