# Production edge: TLS termination, HTTP/2, per-path routing to four services,
# rate limiting by source, maintenance switch, and a stats socket for the operators.

global
    log         /dev/log local0 info
    chroot      /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    user        haproxy
    group       haproxy
    daemon
    maxconn     50000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor except 127.0.0.0/8
    option  http-server-close
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-keep-alive 10s
    timeout queue   30s
    retries 2
    errorfile 503 /etc/haproxy/errors/503.http

frontend edge
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-request redirect scheme https code 308 unless { ssl_fc }
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Rate limiting by client address.
    stick-table type ip size 1m expire 10m store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

    # Maintenance switch driven by a file the operators touch.
    acl maintenance   nbsrv(api_backend) eq 0
    acl is_healthz    path /healthz
    acl host_api      hdr(host) -i api.example.com
    acl host_www      hdr(host) -i www.example.com
    acl is_payments   path_beg /v3/payments
    acl is_orders     path_beg /v3/orders
    acl is_search     path_beg /v3/search
    acl is_ws         hdr(upgrade) -i websocket

    http-request return status 200 content-type application/json \
        string '{"status":"ok"}' if is_healthz
    http-request return status 503 content-type text/html \
        file /etc/haproxy/errors/maintenance.html if maintenance host_api

    use_backend payments_backend if host_api is_payments
    use_backend orders_backend   if host_api is_orders
    use_backend search_backend   if host_api is_search
    use_backend ws_backend       if host_api is_ws
    use_backend storefront_backend if host_www
    default_backend api_backend

backend payments_backend
    balance leastconn
    option httpchk GET /healthz
    http-check expect status 200
    http-request set-header X-Forwarded-Proto https
    timeout server 20s
    server pay1 payments-1.internal.example.com:8443 check ssl verify required \
        ca-file /etc/haproxy/certs/internal-ca.pem
    server pay2 payments-2.internal.example.com:8443 check ssl verify required \
        ca-file /etc/haproxy/certs/internal-ca.pem

backend orders_backend
    balance roundrobin
    option httpchk GET /healthz
    server ord1 orders-1.internal.example.com:8080 check
    server ord2 orders-2.internal.example.com:8080 check

backend search_backend
    balance uri
    hash-type consistent
    timeout server 10s
    server srch1 search-1.internal.example.com:9200 check
    server srch2 search-2.internal.example.com:9200 check

backend ws_backend
    timeout tunnel 1h
    server ws1 ws.internal.example.com:8080 check

backend storefront_backend
    balance roundrobin
    cookie SRV insert indirect nocache
    server web1 storefront-1.internal.example.com:3000 check cookie web1
    server web2 storefront-2.internal.example.com:3000 check cookie web2

backend api_backend
    server api1 api.internal.example.com:8080 check
