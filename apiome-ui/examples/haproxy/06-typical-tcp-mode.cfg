# TCP mode: SNI-based routing with no HTTP semantics at all, plus a health-checked
# database backend. Nothing here is an HTTP operation, which is the point.
global
    maxconn 10000

defaults
    mode tcp
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend tls_passthrough
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl sni_api     req_ssl_sni -i api.example.com
    acl sni_secure  req_ssl_sni -i secure.example.com

    use_backend api_tls     if sni_api
    use_backend secure_tls  if sni_secure
    default_backend reject_tls

backend api_tls
    server api1 api.internal.example.com:8443 check

backend secure_tls
    server secure1 secure.internal.example.com:8443 check

backend reject_tls
    tcp-request content reject

listen postgres
    bind :5432
    mode tcp
    option pgsql-check user haproxy_check
    server pg1 postgres-1.internal.example.com:5432 check
    server pg2 postgres-2.internal.example.com:5432 check backup
